<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef0f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0c12" media="(prefers-color-scheme: dark)">
  <meta name="description" content="A fast, modern calculator with scientific mode, unit converters, history and offline support.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calculator">
  <title>Calculator</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    :root {
      --bg: #eef0f6; --blob1: #c9c2ff; --blob2: #ffd3e8;
      --card: rgba(255, 255, 255, .72); --card-border: rgba(255, 255, 255, .9);
      --text: #161827; --muted: #737891; --faint: #b4b8cc;
      --key: #f6f7fb; --key-text: #161827; --key-shadow: 0 1px 0 rgba(22, 24, 39, .06);
      --fn: #e6e8f2; --sci: transparent; --sci-text: #3d4160; --sci-hover: rgba(22, 24, 39, .05);
      --op: #ebe8ff; --op-text: #5b4bf5;
      --accent: #6d5dfc; --accent-2: #b14dff; --accent-text: #fff;
      --danger: #e5484d; --sheet: #ffffff;
      --shadow: 0 30px 80px -20px rgba(60, 50, 140, .28), 0 8px 24px -12px rgba(60, 50, 140, .18);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b0c12; --blob1: #2d2370; --blob2: #4a1d4a;
        --card: rgba(22, 24, 36, .72); --card-border: rgba(255, 255, 255, .06);
        --text: #f3f4fa; --muted: #8b90a8; --faint: #4a4f68;
        --key: #1f2232; --key-text: #f3f4fa; --key-shadow: 0 1px 0 rgba(255, 255, 255, .04) inset;
        --fn: #2b2f44; --sci: transparent; --sci-text: #c3c7dd; --sci-hover: rgba(255, 255, 255, .06);
        --op: #2a2556; --op-text: #b7aeff;
        --danger: #ff6369; --sheet: #171927;
        --shadow: 0 30px 80px -20px rgba(0, 0, 0, .7);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0b0c12; --blob1: #2d2370; --blob2: #4a1d4a;
      --card: rgba(22, 24, 36, .72); --card-border: rgba(255, 255, 255, .06);
      --text: #f3f4fa; --muted: #8b90a8; --faint: #4a4f68;
      --key: #1f2232; --key-text: #f3f4fa; --key-shadow: 0 1px 0 rgba(255, 255, 255, .04) inset;
      --fn: #2b2f44; --sci: transparent; --sci-text: #c3c7dd; --sci-hover: rgba(255, 255, 255, .06);
      --op: #2a2556; --op-text: #b7aeff;
      --danger: #ff6369; --sheet: #171927;
      --shadow: 0 30px 80px -20px rgba(0, 0, 0, .7);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 16px; overflow: hidden;
      transition: background-color .4s ease, color .4s ease;
    }
    body::before, body::after {
      content: ""; position: fixed; z-index: 0; width: 60vmax; height: 60vmax; border-radius: 50%;
      filter: blur(80px); opacity: .55; pointer-events: none; transition: background .4s ease;
    }
    body::before { background: var(--blob1); top: -25vmax; left: -15vmax; animation: drift 18s ease-in-out infinite alternate; }
    body::after { background: var(--blob2); bottom: -30vmax; right: -20vmax; animation: drift 22s ease-in-out infinite alternate-reverse; }
    @keyframes drift { to { transform: translate(6vmax, 4vmax) scale(1.1); } }

    .app {
      position: relative; z-index: 1;
      width: 100%; max-width: 400px;
      background: var(--card); border: 1px solid var(--card-border);
      -webkit-backdrop-filter: blur(24px) saturate(1.4); backdrop-filter: blur(24px) saturate(1.4);
      border-radius: 32px; padding: 14px 16px 18px;
      box-shadow: var(--shadow);
      display: flex; flex-direction: column;
      overflow: hidden;
      transition: max-width .35s cubic-bezier(.2, .8, .2, 1), background-color .4s ease;
    }
    .app.sci-on { max-width: 440px; }

    /* Top bar */
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .seg {
      position: relative; display: inline-grid; grid-template-columns: 1fr 1fr 1fr;
      background: var(--fn); border-radius: 999px; padding: 3px;
    }
    .seg::before {
      content: ""; position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 3);
      background: var(--key); border-radius: 999px; box-shadow: 0 2px 8px rgba(0, 0, 0, .12);
      transition: transform .3s cubic-bezier(.2, .8, .2, 1);
    }
    .app.sci-on .seg::before { transform: translateX(100%); }
    .app.conv-on .seg::before { transform: translateX(200%); }
    .seg button {
      position: relative; font: inherit; font-size: .85rem; font-weight: 600;
      border: 0; background: none; color: var(--muted); padding: 7px 12px; border-radius: 999px; cursor: pointer;
      transition: color .2s;
    }
    .seg button[aria-pressed="true"] { color: var(--text); }
    .tools { display: flex; align-items: center; gap: 4px; }
    .icon-btn {
      font: inherit; border: 0; background: none; color: var(--muted);
      width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; cursor: pointer;
      transition: background-color .2s, color .2s, transform .15s;
    }
    .icon-btn:hover { background: var(--sci-hover); color: var(--text); }
    .icon-btn:active { transform: scale(.9); }
    .icon-btn svg { width: 20px; height: 20px; }
    .chip {
      font: inherit; font-size: .72rem; font-weight: 700; letter-spacing: .06em;
      border: 0; background: var(--op); color: var(--op-text); border-radius: 999px; padding: 6px 10px; cursor: pointer;
      opacity: 0; transform: scale(.8); pointer-events: none; transition: opacity .25s, transform .25s;
    }
    .app.sci-on .chip { opacity: 1; transform: none; pointer-events: auto; }

    /* Display */
    .display {
      position: relative; flex: none;
      min-height: 148px; padding: 18px 6px 14px;
      display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; gap: 6px;
    }
    .expr, .out {
      max-width: 100%; text-align: right; overflow-wrap: anywhere;
      transition: font-size .28s cubic-bezier(.2, .8, .2, 1), color .28s ease, opacity .28s ease;
    }
    .expr { font-size: var(--expr-size, 2.6rem); font-weight: 400; line-height: 1.15; color: var(--text); letter-spacing: -.01em; }
    .expr .ghost { color: var(--faint); }
    .expr .caret {
      display: inline-block; width: 2px; height: .95em; margin-left: 2px; vertical-align: -.1em;
      background: var(--accent); border-radius: 1px; animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .out { font-size: 1.35rem; color: var(--muted); min-height: 1.6rem; line-height: 1.2; cursor: pointer; border-radius: 8px; }
    .display.done .expr { font-size: 1.15rem; color: var(--muted); }
    .display.done .expr .caret { display: none; }
    .display.done .out { font-size: var(--out-size, 3.4rem); color: var(--text); font-weight: 500; letter-spacing: -.02em; animation: pop .35s cubic-bezier(.2, .8, .2, 1.2); }
    .display.error .out { color: var(--danger); font-size: 1.15rem; font-weight: 500; animation: shake .4s; }
    @keyframes pop { from { transform: translateY(8px) scale(.96); opacity: .4; } }
    @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
    .toast {
      position: absolute; left: 50%; top: 10px; transform: translate(-50%, -6px);
      background: var(--text); color: var(--bg); font-size: .8rem; font-weight: 600;
      padding: 6px 12px; border-radius: 999px; opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* Keys */
    .key {
      position: relative; overflow: hidden;
      font: inherit; border: 0; cursor: pointer; user-select: none; -webkit-user-select: none;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      display: grid; place-items: center;
      transition: transform .18s cubic-bezier(.2, .8, .2, 1.4), filter .15s, background-color .3s, color .3s;
    }
    .key:hover { filter: brightness(1.04); }
    .key:active, .key.pressed { transform: scale(.92); filter: brightness(.96); }
    .key:focus-visible, .icon-btn:focus-visible, .seg button:focus-visible, .chip:focus-visible {
      outline: 3px solid var(--accent); outline-offset: 2px;
    }
    .key .rip {
      position: absolute; width: 10px; height: 10px; border-radius: 50%;
      background: currentColor; opacity: .25; transform: translate(-50%, -50%) scale(0);
      animation: rip .5s ease-out forwards; pointer-events: none;
    }
    @keyframes rip { to { transform: translate(-50%, -50%) scale(18); opacity: 0; } }

    .sci-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s cubic-bezier(.2, .8, .2, 1); }
    .app.sci-on .sci-wrap { grid-template-rows: 1fr; }
    .sci-wrap > div { overflow: hidden; min-height: 0; }
    .sci {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding-bottom: 10px;
      opacity: 0; transform: translateY(-8px); transition: opacity .25s, transform .3s;
    }
    .app.sci-on .sci { opacity: 1; transform: none; }
    .sci .key {
      height: 40px; border-radius: 12px; background: var(--sci); color: var(--sci-text);
      font-size: .95rem; font-weight: 500;
    }
    .sci .key:hover { background: var(--sci-hover); filter: none; }
    .sci sup { font-size: .65em; line-height: 0; }

    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .keys .key {
      height: clamp(56px, 9.5vh, 72px); border-radius: 22px;
      background: var(--key); color: var(--key-text); box-shadow: var(--key-shadow);
      font-size: 1.6rem; font-weight: 500;
    }
    .app.sci-on .keys .key { height: clamp(48px, 7.4vh, 62px); border-radius: 18px; font-size: 1.4rem; }
    .app.conv-on .keys .key { height: clamp(46px, 7.6vh, 64px); border-radius: 18px; }
    .keys .fn { background: var(--fn); font-size: 1.2rem; font-weight: 600; }
    .keys .op { background: var(--op); color: var(--op-text); font-size: 1.75rem; }
    .keys .eq {
      background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-text);
      font-size: 1.9rem; box-shadow: 0 10px 24px -8px rgba(109, 93, 252, .6);
    }
    .keys svg { width: 26px; height: 26px; }

    /* Converter */
    .conv { display: none; flex-direction: column; gap: 10px; padding: 14px 0 12px; min-width: 0; }
    .app.conv-on .conv { display: flex; }
    .app.conv-on .display { display: none; }
    .cats {
      display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px;
      scroll-padding: 0 16px; -webkit-overflow-scrolling: touch;
    }
    .cats::-webkit-scrollbar { display: none; }
    .cat {
      flex: none; font: inherit; font-size: .82rem; font-weight: 600; white-space: nowrap;
      border: 0; background: var(--fn); color: var(--muted); padding: 7px 12px; border-radius: 999px; cursor: pointer;
      transition: background-color .2s, color .2s;
    }
    .cat[aria-selected="true"] { background: var(--op); color: var(--op-text); }
    .conv-rows { position: relative; display: flex; flex-direction: column; gap: 8px; }
    .crow {
      position: relative; background: var(--key); border: 2px solid transparent; border-radius: 20px;
      padding: 6px 10px 6px 12px; cursor: text; min-width: 0; box-shadow: var(--key-shadow);
      transition: border-color .2s, background-color .3s;
    }
    .crow.active { border-color: var(--accent); }
    .crow-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .unit-sel {
      font: inherit; font-size: .88rem; font-weight: 600; color: var(--text); max-width: 75%;
      background: var(--fn); border: 0; border-radius: 10px; padding: 6px 28px 6px 10px; cursor: pointer;
      -webkit-appearance: none; appearance: none; text-overflow: ellipsis;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: right 14px center, right 9px center; background-size: 5px 5px; background-repeat: no-repeat;
    }
    .unit-sel option { color: #161827; background: #fff; }
    .crow .icon-btn { width: 32px; height: 32px; }
    .crow .icon-btn svg { width: 17px; height: 17px; }
    .cval {
      text-align: right; font-size: var(--cv-size, 1.9rem); font-weight: 500; line-height: 1.2; margin-top: 2px;
      overflow-wrap: anywhere; min-height: 1.2em; letter-spacing: -.01em;
      transition: font-size .2s;
    }
    .crow:not(.active) .cval { color: var(--muted); }
    .cval .caret {
      display: inline-block; width: 2px; height: .9em; margin-left: 2px; vertical-align: -.08em;
      background: var(--accent); border-radius: 1px; animation: blink 1.1s steps(1) infinite;
    }
    .crow:not(.active) .caret { display: none; }
    .cprev { text-align: right; font-size: .8rem; color: var(--muted); min-height: 1em; line-height: 1.2; }
    .swap {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1;
      width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--bg); cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-text);
      display: grid; place-items: center; transition: transform .3s cubic-bezier(.2, .8, .2, 1.2);
    }
    .swap svg { width: 18px; height: 18px; }
    .swap.spin { transform: translate(-50%, -50%) rotate(180deg); }
    .swap:focus-visible, .cat:focus-visible, .unit-sel:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .conv-note { font-size: .82rem; color: var(--muted); text-align: center; line-height: 1.5; min-height: 1.5em; }
    .conv-note .text-btn { font-size: .82rem; padding: 2px 6px; }

    /* History sheet */
    .scrim {
      position: absolute; inset: 0; background: rgba(8, 9, 16, .35); opacity: 0; pointer-events: none;
      transition: opacity .3s; z-index: 2; border-radius: inherit;
    }
    .history {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; max-height: 78%;
      background: var(--sheet); border-radius: 28px 28px 0 0; padding: 8px 16px 16px;
      display: flex; flex-direction: column;
      transform: translateY(105%); transition: transform .38s cubic-bezier(.2, .8, .2, 1);
      box-shadow: 0 -20px 40px -20px rgba(0, 0, 0, .3);
    }
    .app.hist-on .history { transform: none; }
    .app.hist-on .scrim { opacity: 1; pointer-events: auto; }
    .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--faint); margin: 2px auto 10px; }
    .hist-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-bottom: 8px; }
    .hist-head h2 { font-size: 1.1rem; margin: 0; }
    .text-btn {
      font: inherit; font-size: .85rem; font-weight: 600; border: 0; background: none; color: var(--accent);
      padding: 6px 10px; border-radius: 10px; cursor: pointer;
    }
    .text-btn:hover { background: var(--sci-hover); }
    .text-btn:disabled { color: var(--faint); cursor: default; background: none; }
    .hist-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; overscroll-behavior: contain; min-height: 120px; }
    .hist-list li {
      display: flex; align-items: center; gap: 8px; padding: 10px 4px;
      animation: slidein .3s cubic-bezier(.2, .8, .2, 1) both;
    }
    .hist-list li + li { border-top: 1px solid var(--fn); }
    @keyframes slidein { from { opacity: 0; transform: translateY(8px); } }
    .hist-item { flex: 1; min-width: 0; text-align: right; font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; border-radius: 10px; }
    .hist-item:hover .hist-res { color: var(--accent); }
    .hist-expr { display: block; color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
    .hist-res { display: block; font-size: 1.4rem; font-weight: 500; overflow-wrap: anywhere; transition: color .2s; }
    .empty { color: var(--muted); text-align: center; padding: 32px 0; font-size: .95rem; }

    @media (max-width: 480px) {
      body { padding: 0; align-items: stretch; }
      .app, .app.sci-on {
        max-width: none; border-radius: 0; border: 0; box-shadow: none;
        padding: max(12px, env(safe-area-inset-top)) 14px max(16px, env(safe-area-inset-bottom));
      }
      .display { flex: 1; }
      .conv { flex: 1; justify-content: flex-end; }
      .keys { gap: 9px; }
    }
    @media (max-height: 640px) {
      .display { min-height: 110px; }
      .keys .key { height: 50px; }
      .app.sci-on .keys .key, .app.conv-on .keys .key { height: 44px; }
      .sci .key { height: 34px; }
      .conv { gap: 6px; padding-top: 8px; }
      .cval { --cv-size: 1.6rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app" id="app" aria-label="Calculator">
    <header class="bar">
      <div class="seg" role="group" aria-label="Mode">
        <button type="button" data-mode="basic" aria-pressed="true">Basic</button>
        <button type="button" data-mode="sci" aria-pressed="false">Scientific</button>
        <button type="button" data-mode="conv" aria-pressed="false">Convert</button>
      </div>
      <div class="tools">
        <button type="button" class="chip" id="angle" title="Switch degrees / radians (keyboard: D)">DEG</button>
        <button type="button" class="icon-btn" id="theme" title="Theme" aria-label="Theme"></button>
        <button type="button" class="icon-btn" id="histBtn" title="History (keyboard: H)" aria-label="History">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
        </button>
      </div>
    </header>

    <section class="display" id="display" aria-live="polite">
      <div class="expr" id="expr"></div>
      <div class="out" id="out" title="Click to copy"></div>
      <div class="toast" id="toast" role="status"></div>
    </section>

    <section class="conv" id="conv" aria-label="Unit converter">
      <div class="cats" id="cats" role="tablist" aria-label="What to convert"></div>
      <div class="conv-rows">
        <div class="crow active" id="row-from" data-side="from">
          <div class="crow-top">
            <select class="unit-sel" id="sel-from" aria-label="From unit"></select>
            <button type="button" class="icon-btn" data-copy-side="from" aria-label="Copy from value"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg></button>
          </div>
          <div class="cval" id="val-from"></div>
          <div class="cprev" id="prev-from"></div>
        </div>
        <button type="button" class="swap" id="swap" aria-label="Swap units" title="Swap units">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg>
        </button>
        <div class="crow" id="row-to" data-side="to">
          <div class="crow-top">
            <select class="unit-sel" id="sel-to" aria-label="To unit"></select>
            <button type="button" class="icon-btn" data-copy-side="to" aria-label="Copy to value"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg></button>
          </div>
          <div class="cval" id="val-to"></div>
          <div class="cprev" id="prev-to"></div>
        </div>
      </div>
      <div class="conv-note" id="convNote" aria-live="polite"></div>
    </section>

    <div class="sci-wrap"><div>
      <div class="sci" id="sci">
        <button class="key" data-a="(">(</button>
        <button class="key" data-a=")">)</button>
        <button class="key" data-a="sq" aria-label="Square"><span>x<sup>2</sup></span></button>
        <button class="key" data-a="pow" aria-label="Power"><span>x<sup>y</sup></span></button>
        <button class="key" data-a="fact" aria-label="Factorial">x!</button>

        <button class="key" data-a="sin">sin</button>
        <button class="key" data-a="cos">cos</button>
        <button class="key" data-a="tan">tan</button>
        <button class="key" data-a="sqrt" aria-label="Square root">√</button>
        <button class="key" data-a="cbrt" aria-label="Cube root">∛</button>

        <button class="key" data-a="asin" aria-label="Inverse sine"><span>sin<sup>−1</sup></span></button>
        <button class="key" data-a="acos" aria-label="Inverse cosine"><span>cos<sup>−1</sup></span></button>
        <button class="key" data-a="atan" aria-label="Inverse tangent"><span>tan<sup>−1</sup></span></button>
        <button class="key" data-a="inv" aria-label="Reciprocal">1/x</button>
        <button class="key" data-a="abs" aria-label="Absolute value">|x|</button>

        <button class="key" data-a="ln">ln</button>
        <button class="key" data-a="log">log</button>
        <button class="key" data-a="exp" aria-label="e to the power"><span>e<sup>x</sup></span></button>
        <button class="key" data-a="pi" aria-label="Pi">π</button>
        <button class="key" data-a="e" aria-label="Euler's number">e</button>
      </div>
    </div></div>

    <div class="keys" id="keys">
      <button class="key fn" data-a="AC" aria-label="All clear">AC</button>
      <button class="key fn" data-a="back" aria-label="Backspace">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-7 7 7 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1Z"/><path d="m17 9-6 6M11 9l6 6"/></svg>
      </button>
      <button class="key fn" data-a="%" aria-label="Percent">%</button>
      <button class="key op" data-a="/" aria-label="Divide">÷</button>

      <button class="key" data-a="7">7</button>
      <button class="key" data-a="8">8</button>
      <button class="key" data-a="9">9</button>
      <button class="key op" data-a="*" aria-label="Multiply">×</button>

      <button class="key" data-a="4">4</button>
      <button class="key" data-a="5">5</button>
      <button class="key" data-a="6">6</button>
      <button class="key op" data-a="-" aria-label="Subtract">−</button>

      <button class="key" data-a="1">1</button>
      <button class="key" data-a="2">2</button>
      <button class="key" data-a="3">3</button>
      <button class="key op" data-a="+" aria-label="Add">+</button>

      <button class="key fn" data-a="sign" aria-label="Plus minus">±</button>
      <button class="key" data-a="0">0</button>
      <button class="key" data-a=".">.</button>
      <button class="key eq" data-a="=" aria-label="Equals">=</button>
    </div>

    <div class="scrim" id="scrim"></div>
    <aside class="history" id="history" aria-label="History" aria-hidden="true">
      <div class="grab"></div>
      <div class="hist-head">
        <h2>History</h2>
        <div>
          <button type="button" class="text-btn" id="histClear">Clear</button>
          <button type="button" class="text-btn" id="histClose">Done</button>
        </div>
      </div>
      <ul class="hist-list" id="histList"></ul>
    </aside>
  </main>
  <script src="js/calc.js"></script>
  <script src="js/units.js"></script>
  <script src="js/app.js"></script>
  <script src="js/convert.js"></script>
</body>
</html>
